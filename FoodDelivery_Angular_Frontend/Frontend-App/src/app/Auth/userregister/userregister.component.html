<div class="container-fluid page-body-wrapper full-page-wrapper">
  <div class="content-wrapper d-flex align-items-center auth px-0">
    <div class="row w-100 mx-0">
      <div class="col-lg-4 mx-auto">
        <div class="auth-form-light text-left py-5 px-4 px-sm-5">
          <div class="brand-logo">
            <img src="../../assets/images/logo.svg" alt="logo">
          </div>
          <h4>New here?</h4>
          <h6 class="fw-light">Signing up is easy. It only takes a few steps</h6>
          <form class="pt-3" #uForm="ngForm" (ngSubmit)="onSubmit(uForm)">
            <div class="form-group">
              <input type="text" class="form-control form-control-lg" id="exampleInputUsername1" placeholder="Full Name"
                name="fullname" #fullname="ngModel" [(ngModel)]="registerModelObj.fullname" required>
              <div class="text-danger" *ngIf="fullname.invalid && (fullname.touched || fullname.dirty)">
                <span *ngIf="fullname.errors?.['required']">Required Property</span>
              </div>
            </div>
            <div class="form-group">
              <input type="text" class="form-control form-control-lg" id="exampleInputUsername1" placeholder="Email ID"
                name="email" #email="ngModel" [(ngModel)]="registerModelObj.email" required>
              <div class="text-danger" *ngIf="email.invalid && (email.touched || email.dirty)">
                <span *ngIf="email.errors?.['required']">Required Property</span>
              </div>
            </div>
            <div class="form-group">
              <input type="text" class="form-control form-control-lg" id="exampleInputUsername1"
                placeholder="Phone Number" name="phone" #phone="ngModel" [(ngModel)]="registerModelObj.phone" required>
              <div class="text-danger" *ngIf="phone.invalid && (phone.touched || phone.dirty)">
                <span *ngIf="phone.errors?.['required']">Required Property</span>
              </div>
            </div>
            <!-- <div class="form-group">
              <input type="date" [disabled]="true" class="form-control form-control-lg" id="exampleInputUsername1"
                placeholder="Registration Date">
            </div> -->
            <div class="form-group">
              <input type="text" class="form-control form-control-lg" id="exampleInputEmail1"
                placeholder="Photo ID Number" name="photo_id_no" #photo_id_no="ngModel"
                [(ngModel)]="registerModelObj.photo_id_no" required>
              <div class="text-danger" *ngIf="photo_id_no.invalid && (photo_id_no.touched || photo_id_no.dirty)">
                <span *ngIf="photo_id_no.errors?.['required']">Required Property</span>
              </div>
            </div>
            <!-- <div class="form-group">
                <select class="form-select form-select-lg" id="exampleFormControlSelect2">
                  <option>Country</option>
                  <option>United States of America</option>
                  <option>United Kingdom</option>
                  <option>India</option>
                  <option>Germany</option>
                  <option>Argentina</option>
                </select>
              </div> -->
            <div class="form-group">
              <input type="password" class="form-control form-control-lg" id="exampleInputPassword1"
                placeholder="Password" name="password" #password="ngModel" [(ngModel)]="registerModelObj.password"
                required>
              <div class="text-danger" *ngIf="password.invalid && (password.touched || password.dirty)">
                <span *ngIf="password.errors?.['required']">Required Property</span>
              </div>
            </div>
            <!-- <div class="mb-4">
              <div class="form-check">
                <label class="form-check-label text-muted">
                  <input type="checkbox" class="form-check-input"> I agree to all Terms & Conditions </label>
              </div>
            </div> -->
            <div class="mt-3 d-grid gap-2">
              <button [disabled]="!uForm.form.valid" class="btn btn-block btn-primary btn-lg fw-medium auth-form-btn"
                type="submit">SIGN UP</button>
            </div>
            <div class="text-center mt-4 fw-light"> Already have an account?
              <a class="text-primary" routerLink="/login" routerLinkActive="active"
                ariaCurrentWhenActive="page">Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- content-wrapper ends -->
</div>
