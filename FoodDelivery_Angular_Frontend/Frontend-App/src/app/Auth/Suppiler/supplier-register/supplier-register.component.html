<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Registration Page</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-8">
            <div class="glass-box">
                <h2>Create Account ✨</h2>
                <form class="pt-3" #uForm="ngForm" (ngSubmit)="onSubmit(uForm)">
                
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1" placeholder="Enter Name"
                    name="supplier_name" #supplier_name="ngModel" [(ngModel)]="supplierRegisterModelObj.supplier_name" required>
                <div class="text-danger" *ngIf="supplier_name.invalid && (supplier_name.touched || supplier_name.dirty)">
                <span *ngIf="supplier_name.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1" placeholder="Enter Email ID"
                    name="supplier_email" #supplier_email="ngModel" [(ngModel)]="supplierRegisterModelObj.supplier_email" required>
                <div class="text-danger" *ngIf="supplier_email.invalid && (supplier_email.touched || supplier_email.dirty)">
                <span *ngIf="supplier_email.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1"
                    placeholder="Enter GST Number" name="supplier_gst_num" #supplier_gst_num="ngModel" [(ngModel)]="supplierRegisterModelObj.supplier_gst_num" required>
                <div class="text-danger" *ngIf="supplier_gst_num.invalid && (supplier_gst_num.touched || supplier_gst_num.dirty)">
                <span *ngIf="supplier_gst_num.errors?.['required']">Required Property</span>
                </div>
                <input type="pin" class="form-control form-control-lg" id="exampleInputUsername1"
                    placeholder="Enter Address Pin Code" name="pincode" #pincode="ngModel" [(ngModel)]="supplierRegisterModelObj.pincode" required>
                <div class="text-danger" *ngIf="pincode.invalid && (pincode.touched || pincode.dirty)">
                <span *ngIf="pincode.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1"
                    placeholder="Enter Address" name="supplier_address" #supplier_address="ngModel" [(ngModel)]="supplierRegisterModelObj.supplier_address" required>
                <div class="text-danger" *ngIf="supplier_address.invalid && (supplier_address.touched || supplier_address.dirty)">
                <span *ngIf="supplier_address.errors?.['required']">Required Property</span>
                </div>
                <input type="date" class="form-control form-control-lg" id="reg_date" 
                    name="reg_date" #reg_date="ngModel" [(ngModel)]="supplierRegisterModelObj.reg_date" [value]="todayDate" required>
                <div class="text-danger" *ngIf="reg_date.invalid && (reg_date.touched || reg_date.dirty)">
                <span *ngIf="reg_date.errors?.['required']">Required Property</span>
                </div>
                <select class="form-control form-control-lg" id="supplier_status" name="supplier_status"
                    #supplier_status="ngModel" [(ngModel)]="supplierRegisterModelObj.supplier_status" required>
                <option value="" disabled selected>Select Supplier Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="On Pause">On Pause</option>
                </select>
                <div class="text-danger" *ngIf="supplier_status.invalid && (supplier_status.touched || supplier_status.dirty)">
                <span *ngIf="supplier_status.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control" id="lblLatitude" placeholder="Latitude" name="latitude"
                    #latitude="ngModel" [(ngModel)]="supplierRegisterModelObj.latitude">
                <div class="text-danger" *ngIf="latitude.invalid && (latitude.touched || latitude.dirty)">
                <span *ngIf="latitude.errors?.['required']">Required Property</span>   
                </div>
                <input type="text" class="form-control" id="lblLongitude" placeholder="Longitude"
                    name="longtitude" #longtitude="ngModel" [(ngModel)]="supplierRegisterModelObj.longtitude" required>
                <div class="text-danger" *ngIf="longtitude.invalid && (longtitude.touched || longtitude.dirty)">
                <span *ngIf="longtitude.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1"
                    placeholder="Enter serviceable Pin Codes separated with comma" name="serv_pin_list" #serv_pin_list="ngModel" [(ngModel)]="supplierRegisterModelObj.serv_pin_list" required>
                <div class="text-danger" *ngIf="serv_pin_list.invalid && (serv_pin_list.touched || serv_pin_list.dirty)">
                <span *ngIf="serv_pin_list.errors?.['required']">Required Property</span>
                </div>
                <input type="password" class="form-control form-control-lg" id="exampleInputPassword1"
                    placeholder="Enter Password" name="supplier_passwd" #supplier_passwd="ngModel" [(ngModel)]="supplierRegisterModelObj.supplier_passwd"
                    required>
                <div class="text-danger" *ngIf="supplier_passwd.invalid && (supplier_passwd.touched || supplier_passwd.dirty)">
                <span *ngIf="supplier_passwd.errors?.['required']">Required Property</span>
                </div>
                <!-- <input type="password" class="form-control mb-4" placeholder="Confirm Password"> -->
                <!-- <input type="text" class="form-control form-control-lg" id="exampleInputEmail1"
                    placeholder="Photo ID Number" name="photo_id_no" #photo_id_no="ngModel"
                    [(ngModel)]="supplierRegisterModelObj.photo_id_no" required>
                <div class="text-danger" *ngIf="photo_id_no.invalid && (photo_id_no.touched || photo_id_no.dirty)">
                <span *ngIf="photo_id_no.errors?.['required']">Required Property</span>
                </div> -->
                <div class="form-group">
                                <!-- <label for="exampleInputPhone">Customer Type</label> -->
                                    <select aria-label="Select Supplier Type" class="form-control dropdown-toggle" 
                                            id="ST" name="ST" 
                                            #ST="ngModel" 
                                            [(ngModel)]="supplierRegisterModelObj.ST.supplier_type" 
                                            required>
                                        
                                        <option value="" disabled selected>Select Supplier Type</option>
                                        <option [ngValue]="item.supplier_type" *ngFor="let item of supplierTypeList">
                                            {{item.description}}
                                        </option>
                                    </select>

                                    <div class="text-danger" *ngIf="ST.invalid && (ST.touched || ST.dirty)">
                                        <span *ngIf="ST.errors?.['required']">Required Property</span>
                                    </div>
                                </div>

                <div class="mt-3 d-grid gap-2">
                <button [disabled]="!uForm.form.valid" class="btn btn-block btn-primary btn-lg fw-medium auth-form-btn"
                    type="submit">Register</button>
                </div>
                <div class="text-center mt-4 fw-light"> Already have an account?
                <a class="text-primary" routerLink="supplier/login" routerLinkActive="active"
                    ariaCurrentWhenActive="page">Login</a>
                </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

</body>
</html>
