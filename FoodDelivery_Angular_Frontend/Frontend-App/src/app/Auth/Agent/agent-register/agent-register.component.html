<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Registration Page</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-8">
            <div class="glass-box">
                <h2>Create Account ✨</h2>
                <form class="pt-3" #uForm="ngForm" (ngSubmit)="onSubmit(uForm)">
                
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1" placeholder="User Name"
                    name="name" #name="ngModel" [(ngModel)]="agentregisterModelObj.name" required>
                <div class="text-danger" *ngIf="name.invalid && (name.touched || name.dirty)">
                <span *ngIf="name.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1" placeholder="Email ID"
                    name="email" #email="ngModel" [(ngModel)]="agentregisterModelObj.email" required>
                <div class="text-danger" *ngIf="email.invalid && (email.touched || email.dirty)">
                <span *ngIf="email.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1"
                    placeholder="Phone Number" name="phone" #phone="ngModel" [(ngModel)]="agentregisterModelObj.phone" required>
                <div class="text-danger" *ngIf="phone.invalid && (phone.touched || phone.dirty)">
                <span *ngIf="phone.errors?.['required']">Required Property</span>
                </div>
                <input type="password" class="form-control form-control-lg" id="exampleInputPassword1"
                    placeholder="Password" name="password" #password="ngModel" [(ngModel)]="agentregisterModelObj.password"
                    required>
                <div class="text-danger" *ngIf="password.invalid && (password.touched || password.dirty)">
                <span *ngIf="password.errors?.['required']">Required Property</span>
                </div>
                <!-- <input type="password" class="form-control mb-4" placeholder="Confirm Password"> -->
                <input type="text" class="form-control form-control-lg" id="exampleInputEmail1"
                    placeholder="Photo ID Number" name="photo_id_no" #photo_id_no="ngModel"
                    [(ngModel)]="agentregisterModelObj.photo_id_no" required>
                <div class="text-danger" *ngIf="photo_id_no.invalid && (photo_id_no.touched || photo_id_no.dirty)">
                <span *ngIf="photo_id_no.errors?.['required']">Required Property</span>
                </div>
                <div class="mt-3 d-grid gap-2">
                <button [disabled]="!uForm.form.valid" class="btn btn-block btn-primary btn-lg fw-medium auth-form-btn"
                    type="submit">Register</button>
                </div>
                <div class="text-center mt-4 fw-light"> Already have an account?
                <a class="text-primary" routerLink="agent/login" routerLinkActive="active"
                    ariaCurrentWhenActive="page">Login</a>
                </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

</body>
</html>
