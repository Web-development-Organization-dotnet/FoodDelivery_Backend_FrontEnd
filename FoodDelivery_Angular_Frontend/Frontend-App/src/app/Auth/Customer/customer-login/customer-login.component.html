<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Login Page</title>

</head>

<body>
<div class="glass-box">
<!-- <div class="container-fluid page-body-wrapper full-page-wrapper">
  <div class="content-wrapper d-flex align-items-center auth px-0">
    <div class="row w-100 mx-0">
      <div class="col-lg-4 mx-auto">
        <div class="auth-form-light text-left py-5 px-4 px-sm-5">
          <div class="brand-logo">
            <img src="../../assets/images/logo.png" alt="logo">
          </div> -->
          <h4>Welcome Customer, ✨ Let's get started ✨</h4>
          <h6 class="fw-light">Sign in to continue.</h6>
          <form class="pt-3" #uForm="ngForm" (ngSubmit)="onSubmit(uForm)">
            <div class="form-group">
              <input type="text" class="form-control form-control-lg" placeholder="Enter User Name" name="cust_email"
                #cust_email="ngModel" [(ngModel)]="custloginModelObj.cust_email" required minlength="3">
              <div class="text-danger" *ngIf="cust_email.invalid && (cust_email.touched || cust_email.dirty)">
                <span *ngIf="cust_email.errors?.['required']">Required Property</span>
                <span *ngIf="cust_email.errors?.['minlength']">Minimum 3 characters</span>
              </div>
            </div>
            <div class="form-group">
              <input type="password" class="form-control form-control-lg" placeholder="Enter cust_passwd" name="cust_passwd"
                #cust_passwd="ngModel" [(ngModel)]="custloginModelObj.cust_passwd" required="true">
              <div class="text-danger" *ngIf="cust_passwd.invalid && (cust_passwd.touched || cust_passwd.dirty)">
                <span *ngIf="cust_passwd.errors?.['required']">Please enter a cust_passwd</span>
              </div>
            </div>
            <div class="mt-3 d-grid gap-2">
              <button [disabled]="!uForm.form.valid" class="btn btn-block btn-primary btn-lg fw-medium auth-form-btn"
                type="submit">SIGN IN</button>
            </div>
          </form>
          <div class="my-2 d-flex justify-content-between align-items-center">
            <!-- <div class="form-check">
                  <label class="form-check-label">
                    <input type="checkbox" class=""> Keep me signed in </label>
                </div> -->

            <a href="#" class="auth-link text-black">Forgot cust_passwd?</a>
          </div>
          <div class="text-center mt-4 fw-light"> Don't have an account?
            <!-- <a href="register.html" class="text-primary">Create</a> -->
            <a class="text-primary" routerLink="/customer/login" routerLinkActive="active"
              ariaCurrentWhenActive="page">Create</a>
          </div>

        <!-- </div>
      </div>
    </div>
  </div> -->
  <!-- content-wrapper ends -->
<!-- </div> -->
</div>
</body>
</html>
