<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Registration Page</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-8">
            <div class="glass-box">
                <h2>Create Account ✨</h2>
                <form class="pt-3" #uForm="ngForm" (ngSubmit)="onSubmit(uForm)">
                
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1" placeholder="Enter Name"
                    name="cust_name" #cust_name="ngModel" [(ngModel)]="custRegisterModelObj.cust_name" required>
                <div class="text-danger" *ngIf="cust_name.invalid && (cust_name.touched || cust_name.dirty)">
                <span *ngIf="cust_name.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1" placeholder="Enter Email ID"
                    name="cust_email" #cust_email="ngModel" [(ngModel)]="custRegisterModelObj.cust_email" required>
                <div class="text-danger" *ngIf="cust_email.invalid && (cust_email.touched || cust_email.dirty)">
                <span *ngIf="cust_email.errors?.['required']">Required Property</span>
                </div>
                <input type="text" class="form-control form-control-lg" id="exampleInputUsername1"
                    placeholder="Enter Phone Number" name="cust_phno" #cust_phno="ngModel" [(ngModel)]="custRegisterModelObj.cust_phno" required>
                <div class="text-danger" *ngIf="cust_phno.invalid && (cust_phno.touched || cust_phno.dirty)">
                <span *ngIf="cust_phno.errors?.['required']">Required Property</span>
                </div>
                <input type="password" class="form-control form-control-lg" id="exampleInputPassword1"
                    placeholder="Enter Password" name="cust_pin" #cust_pin="ngModel" [(ngModel)]="custRegisterModelObj.cust_pin"
                    required>
                <div class="text-danger" *ngIf="cust_pin.invalid && (cust_pin.touched || cust_pin.dirty)">
                <span *ngIf="cust_pin.errors?.['required']">Required Property</span>
                </div>
                <!-- <input type="password" class="form-control mb-4" placeholder="Confirm Password"> -->
                <!-- <input type="text" class="form-control form-control-lg" id="exampleInputEmail1"
                    placeholder="Photo ID Number" name="photo_id_no" #photo_id_no="ngModel"
                    [(ngModel)]="custRegisterModelObj.photo_id_no" required>
                <div class="text-danger" *ngIf="photo_id_no.invalid && (photo_id_no.touched || photo_id_no.dirty)">
                <span *ngIf="photo_id_no.errors?.['required']">Required Property</span>
                </div> -->
                <div class="form-group">
                                <!-- <label for="exampleInputPhone">Customer Type</label> -->
                                    <select aria-label="Select Customer Type" class="form-control dropdown-toggle" 
                                            id="custType" name="custType" 
                                            #custType="ngModel" 
                                            [(ngModel)]="custRegisterModelObj.custType.cust_type_cd" 
                                            required>
                                        
                                        <option value="" disabled selected>Select Customer Type</option>
                                        <option [ngValue]="item.cust_type_cd" *ngFor="let item of custTypeList">
                                            {{item.type_desc}}
                                        </option>
                                    </select>

                                    <div class="text-danger" *ngIf="custType.invalid && (custType.touched || custType.dirty)">
                                        <span *ngIf="custType.errors?.['required']">Required Property</span>
                                    </div>
                                </div>

                <div class="mt-3 d-grid gap-2">
                <button [disabled]="!uForm.form.valid" class="btn btn-block btn-primary btn-lg fw-medium auth-form-btn"
                    type="submit">Register</button>
                </div>
                <div class="text-center mt-4 fw-light"> Already have an account?
                <a class="text-primary" routerLink="agent/login" routerLinkActive="active"
                    ariaCurrentWhenActive="page">Login</a>
                </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

</body>
</html>
