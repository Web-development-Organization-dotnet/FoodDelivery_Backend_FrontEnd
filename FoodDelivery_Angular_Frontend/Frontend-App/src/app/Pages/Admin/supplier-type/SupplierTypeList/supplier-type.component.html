<app-header></app-header>
<!-- partial -->
<div class="container-fluid page-body-wrapper">
    <app-sidebar></app-sidebar>

    <div class="main-panel">
        <div class="content-wrapper">
            <div class="row">

                

                <div class="col-lg-12 grid-margin stretch-card">
                    <div class="card">
                      <div class="card-body">
                        <h4 class="card-title">Supplier Type Information</h4> 
                        <div class="d-flex justify-content-end">
                          <a [routerLink]="['/supplierTypeEntry']" class="btn btn-primary me-2 ">Add Supplier Type</a> 
                        </div>
                        <div class="table-responsive pt-3">
                          <table class="table table-bordered" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger">
                            <thead>
                              <tr>
                                <th> # </th>
                                <th> Supplier Type </th>
                                <th> Description </th>
                                <th> Yearly Turnover </th>
                                <th> Progress </th>
                                <th> Action </th>
                              </tr>
                            </thead>
                            <tbody>
                              @for (item of datatablesource; track $index) {
                                <tr>
                                    <td>{{$index+1}}</td>
                                    <td>{{item.supplier_type}}</td>  
                                    <td>{{item.description}}</td>  
                                    <td>{{item.yearly_turnover}}</td>  
                                    <td> 
                                      <div class="progress">
                                      <div class="progress-bar bg-danger" role="progressbar" [style.width.%]="item.individualPercent" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                  </td>  
                                    <td><a [routerLink]="['/supplierTypeEntry',item.supplier_type]" class="btn btn-primary me-2 ">Edit</a> </td>  
                                </tr>
                              }
                             </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>

                  

            </div>
        </div>
        <!-- content-wrapper ends -->
        <app-footer></app-footer>
    </div>
    <!-- main-panel ends -->
</div>
<!-- page-body-wrapper ends -->
