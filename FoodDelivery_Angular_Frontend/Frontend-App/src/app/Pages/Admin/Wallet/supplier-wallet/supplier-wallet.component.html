<app-header></app-header>
<!-- partial -->
<div class="container-fluid page-body-wrapper">
    <app-sidebar></app-sidebar>

    <div class="main-panel">
        <div class="content-wrapper">
            <div class="row">

                

                <div class="col-lg-12 grid-margin stretch-card">
                    <div class="card">
                      <div class="card-body">
                        <h4 class="card-title">Supplier Wallet Information</h4> 
                        <div class="d-flex justify-content-end">
                          <a [routerLink]="['/supplierTypeEntry']" class="btn btn-primary me-2 ">Add amount to your wallet</a> 
                        </div>
                        <div class="table-responsive pt-3">
                          <table class="table table-bordered" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger">
                            <thead>
                              <tr>
                                <th> # </th>
                                <th> Amount </th>
                                <th> Transaction Mode </th>
                                <th> Time </th>
                                <th> Status </th>
                                <th> Remarks </th>
                              </tr>
                            </thead>
                            <tbody>
                              @for (item of datatablesource; track $index) {
                                <tr>
                                    <td>{{$index+1}}</td>
                                    <td>{{item.amount}}</td>  
                                    <td>{{item.trans_mode}}</td>  
                                    <td>{{item.trans_datetime}}</td>  
                                    <td>{{item.trans_status}}</td>  
                                    <td>{{item.trans_remarks}}</td>  
                                </tr>
                              }
                             </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>

                  

            </div>
        </div>
        <!-- content-wrapper ends -->
        <app-footer></app-footer>
    </div>
    <!-- main-panel ends -->
</div>
<!-- page-body-wrapper ends -->
