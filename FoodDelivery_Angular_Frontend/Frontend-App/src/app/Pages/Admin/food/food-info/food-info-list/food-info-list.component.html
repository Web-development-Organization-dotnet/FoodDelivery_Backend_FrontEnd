<app-header></app-header>
<!-- partial -->
<div class="container-fluid page-body-wrapper">
  <app-sidebar></app-sidebar>

  <div class="main-panel">
    <div class="content-wrapper">
      <div class="row">



        <div class="col-lg-12 grid-margin stretch-card">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title">Food Information</h4>
              <div class="d-flex justify-content-end">
                <a [routerLink]="['/addEditFoodInfo']" class="btn btn-primary me-2 ">Add Food Info</a>
              </div>
              <div class="table-responsive pt-3">
                <table class="table table-bordered" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger">
                  <thead>
                    <tr>
                      <th> # </th>
                      <th> ID </th>
                      <th> Food Name </th>
                      <th> Food Type Code </th>
                      <th> Food Description </th>
                      <th> Quantity </th>
                      <th> Image </th>
                      <th> Action </th>
                    </tr>
                  </thead>
                  <tbody>
                    @for (item of datatablesource; track $index) {
                    <tr>
                      <td>{{$index+1}}</td>
                      <td>{{item.food_id}}</td>
                      <td>{{item.food_name}}</td>
                      <td>{{item.foodType.food_type_cd}}</td>
                      <td>{{item.food_description}}</td>
                      <td>{{item.food_qty}}</td>
                      <td>
                       <ng-image-slider [images]="item.imageCaraousal" #nav></ng-image-slider>
                      </td>
                      <td><a [routerLink]="['/addEditFoodInfo',item.food_id]" class="btn btn-primary me-2 ">Edit</a>
                      </td>
                    </tr>
                    }
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>



      </div>
    </div>
    <!-- content-wrapper ends -->
    <app-footer></app-footer>
  </div>
  <!-- main-panel ends -->
</div>
<!-- page-body-wrapper ends -->
