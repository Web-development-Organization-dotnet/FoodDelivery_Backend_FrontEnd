<app-header></app-header>
<!-- partial -->
<div class="container-fluid page-body-wrapper">
  <app-sidebar></app-sidebar>

  <div class="main-panel">
    <div class="content-wrapper">
      <div class="row">

        <div class="col-12 grid-margin stretch-card">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title">Manage Food Info</h4>
              <p class="card-type_desc">{{foodInfoModelObj.food_id > 0?'Edit':'Insert'}} Food Info</p>
              <form class="forms-sample" #AdminForm="ngForm" (ngSubmit)="onSubmit(AdminForm)">

                <div class="form-group">
                  <label for="exampleInputName1">Food Name</label>
                  <input type="text" class="form-control" id="exampleInputName1" placeholder="Type Name"
                    name="food_name" #food_name="ngModel" [(ngModel)]="foodInfoModelObj.food_name" required
                    minlength="3">

                  <div class="text-danger" *ngIf="food_name.invalid && (food_name.touched || food_name.dirty)">
                    <span *ngIf="food_name.errors?.['required']">Required Property</span>
                    <span *ngIf="food_name.errors?.['minlength']">Minimum 3 characters</span>
                  </div>
                </div>

                <div class="form-group">
                  <label for="exampleInputdesc1">Food Description</label>
                  <!-- <textarea id="w3review" class="form-control" name="w3review" rows="15" placeholder="Enter Description">
                    </textarea> -->
                  <input type="text" class="form-control" id="typedesc" placeholder="Enter Description"
                    name="food_description" #food_description="ngModel" [(ngModel)]="foodInfoModelObj.food_description"
                    required>
                  <div class="text-danger"
                    *ngIf="food_description.invalid && (food_description.touched || food_description.dirty)">
                    <span *ngIf="food_description.errors?.['required']">Required Property</span>
                    <span *ngIf="food_description.errors?.['minlength']">Minimum 20 characters</span>
                  </div>
                </div>

                <div class="form-group">
                  <label for="exampleInputPhone">Food Quantity</label>
                  <input type="text" class="form-control" id="foodquantity" placeholder="Food Quantity" name="food_qty"
                    #food_qty="ngModel" [(ngModel)]="foodInfoModelObj.food_qty" required>
                  <div class="text-danger" *ngIf="food_qty.invalid && (food_qty.touched || food_qty.dirty)">
                    <span *ngIf="food_qty.errors?.['required']">Required Property</span>
                    <!-- <span *ngIf="food_category.errors?.['minlength']">Minimum 3 characters</span> -->
                  </div>
                </div>

                <div class="form-group">
                  <label for="exampleInputEmail3">Food Image</label>
                  <!-- <textarea id="w3review" class="form-control" name="w3review" rows="15" placeholder="Enter Description">
                    </textarea> -->
                  <!-- <input type="text" class="form-control" id="typedesc" placeholder="Enter Description" name="food_img"
                    #food_img="ngModel" [(ngModel)]="foodInfoModelObj.food_img" required> -->

                  <input aria-label="Upload Image" type="file" (change)="onFileChange($event)" required /><button
                    type="submit">Upload</button>

                  <!-- <div class="text-danger" *ngIf="food_img.invalid && (food_img.touched || food_img.dirty)">
                    <span *ngIf="food_img.errors?.['required']">Required Property</span>
                    <span *ngIf="food_img.errors?.['minlength']">Minimum 20 characters</span>
                  </div> -->
                </div>

                <div class="form-group">
                  <label for="exampleInputPhone">Food Type</label>
                  <select aria-label="Select Food Type" class="form-control dropdown-toggle" id="foodInfo"
                    name="foodType" #foodType="ngModel" [(ngModel)]="foodInfoModelObj.foodType.food_type_cd" required>
                    <option value="" disabled selected>Select Food Type</option>
                    <option [ngValue]="item.food_type_cd" *ngFor="let item of foodTypeList">{{item.food_type}}
                    </option>
                  </select>

                  <div class="text-danger" *ngIf="foodType.invalid && (foodType.touched || foodType.dirty)">
                    <span *ngIf="foodType.errors?.['required']">Required Property</span>
                    <!-- <span *ngIf="food_category.errors?.['minlength']">Minimum 3 characters</span> -->
                  </div>
                </div>

                <button type="submit" class="btn btn-primary me-2">{{foodInfoModelObj.food_id >
                  0?'Update':'Register'}}</button>
                <a class="btn btn-light" routerLink="/foodInfoList" routerLinkActive="active"
                  ariaCurrentWhenActive="page">Cancel</a>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>
    <!-- content-wrapper ends -->
    <app-footer></app-footer>
  </div>
  <!-- main-panel ends -->
</div>
