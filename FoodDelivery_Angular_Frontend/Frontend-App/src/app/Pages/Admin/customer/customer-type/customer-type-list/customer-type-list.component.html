<app-header></app-header>
<!-- partial -->
<div class="container-fluid page-body-wrapper">
  <app-sidebar></app-sidebar>

  <div class="main-panel">
    <div class="content-wrapper">
      <div class="row">



        <div class="col-lg-12 grid-margin stretch-card">
          <div class="card">
            <div class="card-body">
              <h4 class="card-title">Customer Type Information</h4>
              <div class="d-flex justify-content-end">
                <a [routerLink]="['/addEditCustomerType']" class="btn btn-primary me-2 ">Add Customer Type</a>
              </div>
              <div class="table-responsive pt-3">
                <table class="table table-bordered" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger">
                  <thead>
                    <tr>
                      <th> # </th>
                      <th> Customer Type </th>
                      <th> Order Limit </th>
                      <th> Turnover </th>
                      <th> Action </th>
                    </tr>
                  </thead>
                  <tbody>
                    @for (item of datatablesource; track $index) {
                    <tr>
                      <td>{{$index+1}}</td>
                      <td>{{item.type_desc}}</td>
                      <td>{{item.order_limit}}</td>
                      <td>{{item.total_turnover}}</td>
                      <td><a [routerLink]="['/addEditCustomerType',item.cust_type_cd]"
                          class="btn btn-primary me-2 ">Edit</a>
                      </td>
                    </tr>
                    }
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>



      </div>
    </div>
    <!-- content-wrapper ends -->
    <app-footer></app-footer>
  </div>
  <!-- main-panel ends -->
</div>
<!-- page-body-wrapper ends -->
