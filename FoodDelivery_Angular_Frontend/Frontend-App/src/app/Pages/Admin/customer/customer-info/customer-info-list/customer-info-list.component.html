<app-header></app-header>
<!-- partial -->
<div class="container-fluid page-body-wrapper">
    <app-sidebar></app-sidebar>

    <div class="main-panel">
        <div class="content-wrapper">
            <div class="row">



                <div class="col-lg-12 grid-margin stretch-card">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Customer Type Information</h4>
                            <div class="d-flex justify-content-end">
                                <a [routerLink]="['/addEditCustomerInfo']" class="btn btn-primary me-2 ">Add Customer
                                    Info</a>
                            </div>
                            <div class="table-responsive pt-3">
                                <table class="table table-bordered" datatable [dtOptions]="dtOptions"
                                    [dtTrigger]="dtTrigger">
                                    <thead>
                                        <tr>
                                            <th> # </th>
                                            <th> Customer Id </th>
                                            <th> Customer Type </th>
                                            <th> Name</th>
                                            <th> Phone Number </th>
                                            <th> Email</th>
                                            <th> Pin</th>

                                            <th> Action </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        @for (item of datatablesource; track $index) {
                                        <tr>
                                            <td>{{$index+1}}</td>
                                            <td>{{item.cust_id}}</td>
                                            <td>{{item.cust_type_cd}}</td>
                                            <td>{{item.cust_name}}</td>
                                            <td>{{item.cust_email}}</td>
                                            <td>{{item.cust_phno}}</td>
                                             <td>{{item.cust_pin}}</td>
                                            <td><a [routerLink]="['/addEditCustomerInfo',item.cust_id]"
                                                    class="btn btn-primary me-2 ">Edit</a>
                                            </td>
                                        </tr>
                                        }
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>



            </div>
        </div>
        <!-- content-wrapper ends -->
        <app-footer></app-footer>
    </div>
    <!-- main-panel ends -->
</div>
<!-- page-body-wrapper ends -->
